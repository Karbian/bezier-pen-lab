name: Refresh GitHub Pages assets

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "public/**"
      - "index.source.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Refresh branch-hosted assets
        run: |
          rm -rf assets
          rm -rf illustrator
          cp -R dist/assets assets
          cp -R dist/illustrator illustrator
          cp dist/index.html index.html
          cp dist/favicon.svg favicon.svg
          cp dist/homer-reference.png homer-reference.png

      - name: Commit refreshed build
        run: |
          git add assets illustrator index.html favicon.svg homer-reference.png
          if git diff --cached --quiet; then
            echo "Published assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh GitHub Pages build [skip ci]"
          git push
